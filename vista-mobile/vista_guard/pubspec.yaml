name: vista_guard
description: VISTA Security Guard mobile app (Module 5 of the VISTA capstone).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  vista_api:
    path: ../packages/vista_api
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^5.1.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  connectivity_plus: ^6.0.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
